apiVersion: apps/v1
kind: Deployment
metadata:
  name: logiforge-api
  namespace: logiforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logiforge-api
  template:
    metadata:
      labels:
        app: logiforge-api
    spec:
      containers:
        - name: api
          image: logiforge/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: logiforge-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: logiforge-api
  namespace: logiforge
spec:
  selector:
    app: logiforge-api
  ports:
    - port: 80
      targetPort: 8080
