apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logiforge
  namespace: logiforge
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: [app.logiforge.example, api.logiforge.example]
      secretName: logiforge-tls
  rules:
    - host: app.logiforge.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logiforge-web
                port:
                  number: 80
    - host: api.logiforge.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logiforge-api
                port:
                  number: 80
