apiVersion: apps/v1
kind: Deployment
metadata:
  name: logiforge-web
  namespace: logiforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logiforge-web
  template:
    metadata:
      labels:
        app: logiforge-web
    spec:
      containers:
        - name: web
          image: logiforge/web:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: logiforge-web
  namespace: logiforge
spec:
  selector:
    app: logiforge-web
  ports:
    - port: 80
      targetPort: 3000
